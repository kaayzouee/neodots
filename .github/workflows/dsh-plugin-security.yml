name: DSH plugin security (daily)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/programs/deepseek-harness.nix"
      - "packages/deepseek-harness/**"
      - ".github/workflows/dsh-plugin-security.yml"

permissions:
  contents: read

concurrency:
  group: dsh-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: siwc
            kind: npm
            source: dsh-plugin-chatgpt-siwc@0.9.7
          - name: ponytail
            kind: npm
            source: "@wenaixi/dsh-ponytail@5.6.2"
          - name: ghidra
            kind: npm
            source: dsh-ghidra@0.11.4
          - name: nix-dev-shell
            kind: github
            repo: running-grass/dsh-nix-dev-shell
            rev: 90d39a724613d151838faac7972e3a06693df56a
            subdir: "."
          - name: java-lsp
            kind: github
            repo: 988hj7tczd-oss/dsh-lsp-packs
            rev: 258bb6409c504fa1eed20b6f70d13009522ca0ce
            subdir: dsh-lsp-java
          - name: github-ci
            kind: npm
            source: dsh-github-ci@1.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check pinned npm dependency graph (no lifecycle scripts)
        if: matrix.kind == 'npm'
        env:
          SPEC: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/plugin-audit
          cd /tmp/plugin-audit
          printf '{"private":true,"name":"dsh-audit","version":"1.0.0"}\n' > package.json
          # Match DSH's autoInstallPeers: false: peers are supplied by the host.
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact --omit=dev --legacy-peer-deps "$SPEC"
          npm audit --audit-level=high --omit=dev
      - name: Retrieve exact Git commit without running its code
        if: matrix.kind == 'github'
        env:
          REPO: ${{ matrix.repo }}
          REV: ${{ matrix.rev }}
          SUBDIR: ${{ matrix.subdir }}
        run: |
          set -euo pipefail
          mkdir /tmp/source
          git -C /tmp/source init -q
          git -C /tmp/source remote add origin "https://github.com/$REPO.git"
          git -C /tmp/source fetch --depth=1 origin HEAD
          if ! git -C /tmp/source cat-file -e "$REV^{commit}" 2>/dev/null; then
            # Some GitHub repos reject a shallow fetch of an arbitrary commit SHA.
            # Fetch full advertised history and verify the pinned object locally.
            git -C /tmp/source fetch --unshallow origin || git -C /tmp/source fetch origin
          fi
          git -C /tmp/source cat-file -e "$REV^{commit}"
          git -C /tmp/source checkout -q --detach "$REV"
          test -f "/tmp/source/$SUBDIR/package.json"
          mkdir /tmp/plugin-audit
          cp "/tmp/source/$SUBDIR/package.json" /tmp/plugin-audit/
      - name: Audit Git plugin declared runtime dependencies
        if: matrix.kind == 'github'
        run: |
          set -euo pipefail
          cd /tmp/plugin-audit
          # Resolve fresh dependencies without auto-installing host-provided peers.
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json'));
          delete p.scripts;
          delete p.devDependencies;
          fs.writeFileSync('package.json', JSON.stringify(p));
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --omit=dev --legacy-peer-deps
          npm audit --audit-level=high --omit=dev
      - name: Check source against high-risk patterns
        if: matrix.kind == 'github'
        run: |
          set -euo pipefail
          # Heuristic signal only; report executable installation hooks for review.
          grep -R -n -E '"(preinstall|install|postinstall|prepare)"[[:space:]]*:'             "/tmp/source/${{ matrix.subdir }}/package.json" || true

  host-dependency-audit:
    name: Locked DSH host production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Audit exactly the DSH source pinned by Nix
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^[[:space:]]*rev = "\([0-9a-f]\{40\}\)";/\1/p' packages/deepseek-harness/default.nix)
          test "${#rev}" -eq 40
          git clone --filter=blob:none --no-checkout https://github.com/kaayzouee/deepseek-harness.git /tmp/dsh-host
          git -C /tmp/dsh-host fetch origin "$rev"
          git -C /tmp/dsh-host checkout --detach "$rev"
          test "$(git -C /tmp/dsh-host rev-parse HEAD)" = "$rev"
          cd /tmp/dsh-host
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const text = readFileSync('pnpm-lock.yaml', 'utf8')
          const matches = [...text.matchAll(/^  ['"]?zod@(\d+\.\d+\.\d+)(?:\([^\n]*)?['"]?:/gm)]
          const versions = [...new Set(matches.map(m => m[1]))]
          if (versions.length !== 1 || versions[0] !== '4.6.7') {
            throw new Error('expected patched Zod 4.6.7 only, got: ' + versions.join(', '))
          }
          NODE
          # This is the host's own frozen pnpm graph, not the six plugin graphs.
          pnpm audit --prod --audit-level high

  compatibility-gate:
    name: DSH compatibility declarations
    runs-on: ubuntu-24.04
    steps:
      - name: Report host and plugin security boundaries
        run: |
          echo "The pinned DSH host lockfile is audited independently by the blocking host-dependency-audit job." >> "$GITHUB_STEP_SUMMARY"
          echo "Plugin peer dependencies supplied at runtime are not included in isolated plugin audits." >> "$GITHUB_STEP_SUMMARY"
      - name: Flag known incompatible Java LSP range
        run: |
          echo "::warning title=Java LSP compatibility::Pinned @dsh-lsp-packs/dsh-lsp-java@0.1.0 declares DSH <0.2.0, while the locally packaged DSH fork is newer. This plugin is not verified compatible."
