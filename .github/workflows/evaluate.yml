name: Evaluate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: evaluate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  evaluate:
    name: Evaluate NixOS configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install

      - name: Check GNOME/Wayland migration has no X11 leftovers
        run: bash tests/check-wayland-migration.sh

      - name: Provide CI hardware configuration
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { modulesPath, ... }:
          {
            imports = [
              (modulesPath + "/profiles/qemu-guest.nix")
            ];

            boot.initrd.availableKernelModules = [
              "virtio_pci"
              "virtio_scsi"
              "ahci"
              "sd_mod"
            ];

            fileSystems."/" = {
              device = "/dev/vda2";
              fsType = "btrfs";
            };

            fileSystems."/boot" = {
              device = "/dev/vda1";
              fsType = "vfat";
              options = [ "fmask=0077" "dmask=0077" ];
            };
          }
          EOF

      - name: Check flake outputs
        run: nix flake check --all-systems --no-build

      - name: Evaluate NixOS system derivation
        run: nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath

      - name: Run GTK, Qt, SDL and Electron Wayland client smoke tests
        run: nix build .#checks.x86_64-linux.wayland-client-smoke --print-build-logs

      - name: Run GDM/GNOME reboot integration test when KVM is available
        run: |
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            nix build .#checks.x86_64-linux.gnome-wayland-vm --print-build-logs
          else
            echo "::notice::Skipped the GDM/GNOME QEMU integration test because this runner does not expose writable /dev/kvm. The headless Wayland client smoke test still runs."
          fi
