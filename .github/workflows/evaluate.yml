name: Evaluate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: evaluate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  evaluate:
    name: Evaluate NixOS configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install

      - name: Check GNOME/Wayland migration has no X11 leftovers
        run: bash tests/check-wayland-migration.sh

      - name: Check source licensing and private-artifact policy
        run: |
          python3 tests/license-headers.py
          python3 tests/repository-policy.py

      - name: Check flake outputs
        run: nix flake check --all-systems --no-build

      - name: Evaluate NixOS system derivation
        run: nix eval --raw .#nixosConfigurations.ci.config.system.build.toplevel.drvPath

      - name: Run deterministic security, recovery and desktop regressions
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.config-invariants \
            .#checks.x86_64-linux.repository-policy \
            .#checks.x86_64-linux.sops-recovery \
            .#checks.x86_64-linux.dsh-installer \
            .#checks.x86_64-linux.river-session \
            .#checks.x86_64-linux.river-quickshell \
            .#checks.x86_64-linux.cpp-toolchain

      - name: Run GTK, Qt, SDL and Electron Wayland client smoke tests
        run: nix build .#checks.x86_64-linux.wayland-client-smoke --print-build-logs

      - name: Run GNOME, River and security/recovery VMs when KVM is available
        run: |
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            nix build --no-link --print-build-logs \
              .#checks.x86_64-linux.gnome-wayland-vm \
              .#checks.x86_64-linux.river-vm \
              .#checks.x86_64-linux.security-persistence-vm
          else
            echo "::notice::SKIPPED: GNOME, River and security/persistence QEMU tests require writable /dev/kvm. Deterministic checks and headless Wayland smoke still run; VM coverage is not passed."
          fi
