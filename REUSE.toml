version = 1
SPDX-PackageName = "neodots"
SPDX-PackageDownloadLocation = "https://github.com/kaayzouee/neodots"

# Files that cannot carry an inline license header (binary, generated, encrypted
# or format does not allow comments). tests/check-license-headers.py reads this
# file and skips the listed paths.

[[annotations]]
path = ["flake.lock", "secrets/secrets.yaml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 kaayzouee"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "packages/kwm/set-floating-action.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 kaayzouee"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "config/quickshell/neodots/assets/icons/mactahoe/**.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "MacTahoe icon theme contributors (https://github.com/vinceliuice/MacTahoe-icon-theme)"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "config/quickshell/neodots/assets/icons/*.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 kaayzouee"
SPDX-License-Identifier = "GPL-3.0-only"
