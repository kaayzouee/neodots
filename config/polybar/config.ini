; ~/.config/polybar/config.ini
; Translated for XFCE (xfwm4)

[colors]
background = #1e1e2e
foreground = #cdd6f4
alt = #313244
accent = #89b4fa
urgent = #f38ba8

[bar/main]
width = 100%
height = 30pt
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.alt}
font-0 = monospace:size=10
modules-left = workspaces
modules-center = window
modules-right = cpu memory filesystem pulseaudio network battery date
cursor-click = default
wm-restack = generic

[module/tray]
type = internal/tray
tray-padding = 2
format-margin = 4

[module/workspaces]
type = internal/xworkspaces
enable-click = true
enable-scroll = false
; %name% is the EWMH workspace name xfwm4 exposes (e.g. "1", "2", or a custom name)
label-active = %name%
label-active-background = #313244
label-active-underline = #89b4fa
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-padding = 1
label-empty = %name%
label-empty-padding = 1

[module/window]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 10
format-prefix = "cpu "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 10
format-prefix = "mem "
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
label-mounted = %mountpoint% %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = vol %percentage%%
label-muted = muted

[module/network]
type = internal/network
interface = wlp98s0
interval = 3

format-connected = <label-connected>
format-connected-foreground = ${colors.accent}
label-connected =  %essid% %signal%

format-disconnected = <label-disconnected>
label-disconnected = disconnected
label-disconnected-foreground = ${colors.alt}

[module/battery]
type = internal/battery
full-at = 99
battery = BAT1
adapter = ACAD
poll-interval = 5
label-charging = %percentage%% charging
label-discharging = %percentage%%
label-full = full

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = false
