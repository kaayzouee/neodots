; ~/.config/polybar/config.ini
; XFCE (xfwm4) — text-only, format-tag click handling

[colors]
background = #1e1e2e
foreground = #cdd6f4
alt = #313244
accent = #89b4fa
urgent = #f38ba8

[bar/main]
width = 100%
height = 30pt
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.alt}
font-0 = monospace:size=10
modules-left = workspaces
modules-center = window
modules-right = cpu memory filesystem pulseaudio network battery bluetooth date
cursor-click = default
wm-restack = generic

[module/workspaces]
type = internal/xworkspaces
enable-click = true
enable-scroll = false
label-active = %name%
label-active-background = #313244
label-active-underline = #89b4fa
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-padding = 1
label-empty = %name%
label-empty-padding = 1

[module/window]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 10
format-prefix = "cpu "
format = %{A1:xfce4-terminal -e btop:}<label>%{A}
label = %percentage:2%%

[module/memory]
type = custom/script
exec = free | awk '/^Mem:/ {printf "%d%%", $3/$2 * 100}'
interval = 10
format-prefix = "mem "
click-left = xfce4-terminal -e btop

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = %{A1:thunar /:}<label-mounted>%{A}
label-mounted = %mountpoint% %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = %{A1:pavucontrol:}%{A3:pactl set-sink-mute @DEFAULT_SINK@ toggle:}<label-volume>%{A}%{A}
label-volume = vol %percentage%%
format-muted = %{A1:pavucontrol:}%{A3:pactl set-sink-mute @DEFAULT_SINK@ toggle:}<label-muted>%{A}%{A}
label-muted = muted

[module/network]
type = internal/network
interface = wlp98s0
interval = 3

format-connected = <label-connected>
format-connected-foreground = ${colors.accent}
label-connected = %{A1:xfce4-terminal -e nmtui:}%essid% %signal%%{A}

format-disconnected = <label-disconnected>
label-disconnected = %{A1:xfce4-terminal -e nmtui:}disconnected%{A}
label-disconnected-foreground = ${colors.alt}

[module/battery]
type = custom/script

exec = $HOME/.config/polybar/scripts/battery.sh
interval = 10

format = %{A1:xfce4-power-manager-settings:}<label>%{A}
label = %output%

click-left = xfce4-power-manager-settings

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && echo "on" || echo "off"
interval = 5
format-prefix = "bt "
label = %output%
click-left = blueman-manager

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
format = %{A1:xfce4-terminal --command "sh -c 'cal -y; read'":}<label>%{A}
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = false
